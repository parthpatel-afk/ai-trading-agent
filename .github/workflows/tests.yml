name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"  # matches runtime.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pyarrow is pinned below 19: the unpinned pyarrow 26 does not import next to the numpy 1.26 line (run 38655620797)
          pip install "numpy>=1.26,<2.0" "pandas>=2.2,<2.3" "pyarrow>=14,<19" yfinance alpaca-py loguru python-dotenv

      - name: Fetch daily bars (yfinance, no API key)
        run: python -m backtest.data.fetch

      - name: Live bot logic
        run: |
          python scripts/test_backtest_foundation.py
          python scripts/test_exit_math.py

      - name: Option pricing
        run: python scripts/test_pricing_synth.py

      - name: Backtest engine
        run: python scripts/test_engine.py

      - name: Parameter sweeps
        run: python scripts/test_sweep_landscape.py
